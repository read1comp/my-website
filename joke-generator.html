<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5em;
        }

        .joke-emoji {
            display: inline-block;
            margin-left: 10px;
            animation: bounce 1s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .category-filter {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .category-btn {
            padding: 10px 20px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9em;
        }

        .category-btn:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .category-btn.active {
            background: #667eea;
            color: white;
        }

        .joke-container {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 25px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .joke-text {
            font-size: 1.2em;
            color: #333;
            line-height: 1.6;
            margin-bottom: 15px;
        }

        .joke-setup {
            font-weight: 600;
            margin-bottom: 10px;
        }

        .joke-delivery {
            color: #555;
            font-style: italic;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 2px solid rgba(0, 0, 0, 0.1);
        }

        .joke-type {
            font-size: 0.85em;
            color: #888;
            margin-top: 10px;
        }

        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .get-joke-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 40px;
            font-size: 1.1em;
        }

        .get-joke-btn:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .get-joke-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .copy-btn, .share-btn {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
            padding: 10px 20px;
        }

        .copy-btn:hover, .share-btn:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-weight: 600;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ffe0e0;
            color: #d32f2f;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .success-message {
            background: #e0f2e0;
            color: #2e7d32;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            margin-top: 10px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        .footer {
            text-align: center;
            color: #888;
            font-size: 0.85em;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .joke-text {
                font-size: 1em;
            }

            .category-btn {
                padding: 8px 15px;
                font-size: 0.85em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>😂 Joke Generator <span class="joke-emoji">🎭</span></h1>

        <div class="category-filter">
            <button class="category-btn active" data-category="Any">Any</button>
            <button class="category-btn" data-category="General">General</button>
            <button class="category-btn" data-category="Programming">Programming</button>
            <button class="category-btn" data-category="Knock-knock">Knock-Knock</button>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <div class="joke-container">
            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p>Getting a funny joke for you...</p>
            </div>
            <div id="jokeContent">
                <p class="joke-text">Click the button below to get a random joke! 🎉</p>
            </div>
        </div>

        <div class="button-group">
            <button class="get-joke-btn" id="getJokeBtn">🎲 Get New Joke</button>
            <button class="copy-btn" id="copyBtn" style="display: none;">📋 Copy</button>
            <button class="share-btn" id="shareBtn" style="display: none;">🔗 Share</button>
        </div>

        <div class="success-message" id="successMessage">Copied to clipboard! ✅</div>

        <div class="footer">
            <p>Powered by <a href="https://v2.jokeapi.dev/" target="_blank" style="color: #667eea; text-decoration: none;">JokeAPI</a></p>
        </div>
    </div>

    <script>
        let currentJoke = '';
        let selectedCategory = 'Any';

        const getJokeBtn = document.getElementById('getJokeBtn');
        const jokeContent = document.getElementById('jokeContent');
        const loading = document.getElementById('loading');
        const copyBtn = document.getElementById('copyBtn');
        const shareBtn = document.getElementById('shareBtn');
        const errorMessage = document.getElementById('errorMessage');
        const successMessage = document.getElementById('successMessage');
        const categoryButtons = document.querySelectorAll('.category-btn');

        // Category filter
        categoryButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                categoryButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                selectedCategory = btn.dataset.category;
                getJoke();
            });
        });

        // Get joke from API
        async function getJoke() {
            try {
                getJokeBtn.disabled = true;
                loading.style.display = 'block';
                jokeContent.style.display = 'none';
                errorMessage.style.display = 'none';
                copyBtn.style.display = 'none';
                shareBtn.style.display = 'none';

                const category = selectedCategory === 'Any' ? 'Any' : selectedCategory;
                const response = await fetch(`https://v2.jokeapi.dev/joke/${category}?format=json`);

                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();

                if (data.error) {
                    throw new Error('Could not retrieve joke');
                }

                displayJoke(data);
                copyBtn.style.display = 'inline-block';
                shareBtn.style.display = 'inline-block';

            } catch (error) {
                showError('Oops! Could not load joke. Please try again.');
                console.error('Error:', error);
            } finally {
                getJokeBtn.disabled = false;
                loading.style.display = 'none';
                jokeContent.style.display = 'block';
            }
        }

        // Display joke
        function displayJoke(data) {
            let jokeHTML = '';

            if (data.type === 'single') {
                currentJoke = data.joke;
                jokeHTML = `<p class="joke-text">${data.joke}</p>`;
            } else if (data.type === 'twopart') {
                currentJoke = `${data.setup}\n\n${data.delivery}`;
                jokeHTML = `
                    <p class="joke-setup">${data.setup}</p>
                    <p class="joke-delivery">${data.delivery}</p>
                `;
            }

            jokeHTML += `<p class="joke-type">Type: ${data.type === 'single' ? 'Single' : 'Two-part'}</p>`;
            jokeContent.innerHTML = jokeHTML;
        }

        // Show error
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.style.display = 'block';
            jokeContent.innerHTML = '<p class="joke-text">Try again! 🎲</p>';
            copyBtn.style.display = 'none';
            shareBtn.style.display = 'none';
        }

        // Copy to clipboard
        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(currentJoke).then(() => {
                successMessage.style.display = 'block';
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 2000);
            }).catch(() => {
                alert('Could not copy to clipboard');
            });
        });

        // Share joke
        shareBtn.addEventListener('click', () => {
            if (navigator.share) {
                navigator.share({
                    title: 'Check out this joke!',
                    text: currentJoke
                }).catch(err => console.log('Error sharing:', err));
            } else {
                alert('Share this joke: ' + currentJoke);
            }
        });

        // Get initial joke
        getJokeBtn.addEventListener('click', getJoke);
        getJoke();
    </script>
</body>
</html>
